# cargo-deny configuration for the Rust workspace (bloqr-compiler,
# bloqr-validator-core, bloqr-validator-core-cli). Run via `cargo deny check`
# (wired into .github/workflows/rust-clippy.yml). See
# https://embarkstudios.github.io/cargo-deny/ for the full schema.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    # This workspace's own license (bloqr-compiler, bloqr-validator-core,
    # bloqr-validator-core-cli) - not a third-party dependency license.
    "GPL-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
