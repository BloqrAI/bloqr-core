# Python Rules Compiler Build and Test workflow

name: Python Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - 'src/rules-compiler-python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/rules-compiler-python/**'
      - '.github/workflows/python.yml'

defaults:
  run:
    working-directory: src/rules-compiler-python

jobs:
  build:
    name: Build and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: src/rules-compiler-python/pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .
        continue-on-error: true

      - name: Run tests with coverage
        run: pytest --cov=rules_compiler --cov-report=term-missing

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: src/rules-compiler-python/pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy rules_compiler
        continue-on-error: true
