name: Publish Rust Validator Crates to crates.io

# Publishes src/rules-validator's two crates - bloqr-validator-core (library)
# and bloqr-validator-core-cli (the rules-validate binary, installable via
# `cargo install`) - to crates.io whenever either changes on main, or on
# demand. Mirrors publish-jsr.yml's pattern: path-filtered push trigger,
# independent of the repo-wide binary release in release.yml, so a
# validation-logic or CLI-only change doesn't have to wait for (or force) a
# full multi-language binary release to reach crates.io. See
# docs/architecture/versioning-strategy.md.
#
# rules-compiler (src/rules-compiler-rust/) is NOT published - it has no
# external consumer as a library and its binary already ships via
# release.yml's GitHub Release bundle.
#
# AUTHENTICATION: CARGO_REGISTRY_TOKEN (org-level Action secret).
#
# VERSIONING: each crate's own Cargo.toml `version` field is the source of
# truth, bumped by hand today (no automated Conventional-Commits bump
# workflow yet - see docs/architecture/versioning-strategy.md's "what's
# still manual" note). This workflow doesn't bump anything, it just
# publishes whatever version is currently checked in, when it isn't already
# published - `cargo publish` has no native --skip-duplicate, so the
# idempotency check below does that job instead.
#
# bloqr-validator-core-cli depends on bloqr-validator-core via the registry
# (see its Cargo.toml's `version` alongside `path`), so publish-cli always
# runs after publish-core.

on:
  push:
    branches: ["main"]
    paths:
      - "src/rules-validator/rules-validator-core/**"
      - "src/rules-validator/rules-validator-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish-crates.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-core:
    name: Publish bloqr-validator-core
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Dry-run publish (validates the package before the real push)
        run: cargo publish -p bloqr-validator-core --dry-run --locked

      - name: Check if this version is already published
        id: check
        run: |
          pkgid=$(cargo pkgid -p bloqr-validator-core)
          version="${pkgid##*@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/bloqr-validator-core/${version}")
          if [ "$status" = "200" ]; then
            echo "Version ${version} is already published - skipping (idempotent re-run)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish bloqr-validator-core to crates.io
        id: publish
        if: steps.check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bloqr-validator-core --locked

      - name: Report publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::crates.io publish failed. Check CARGO_REGISTRY_TOKEN is configured as an org-level action secret with publish-new/publish-update/yank scopes for bloqr-validator-core."
          exit 1

  publish-cli:
    name: Publish bloqr-validator-core-cli
    needs: publish-core
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      # A brand-new bloqr-validator-core version published moments ago by the
      # publish-core job above may not be visible on the registry index yet
      # (crates.io propagation isn't instant) - retry the dry-run a few times
      # rather than failing immediately if bloqr-validator-core-cli's version
      # requirement can't yet be resolved against it.
      - name: Dry-run publish (validates the package before the real push)
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo publish -p bloqr-validator-core-cli --dry-run --locked; then
              exit 0
            fi
            echo "Dry-run failed (attempt ${attempt}/5) - registry index may not have propagated bloqr-validator-core's latest version yet. Retrying in 15s..."
            sleep 15
            cargo update -p bloqr-validator-core-cli --precise "$(cargo pkgid -p bloqr-validator-core | sed 's/.*@//')" 2>/dev/null || true
          done
          echo "::error::cargo publish --dry-run kept failing for bloqr-validator-core-cli after 5 attempts."
          exit 1

      - name: Check if this version is already published
        id: check
        run: |
          pkgid=$(cargo pkgid -p bloqr-validator-core-cli)
          version="${pkgid##*@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/bloqr-validator-core-cli/${version}")
          if [ "$status" = "200" ]; then
            echo "Version ${version} is already published - skipping (idempotent re-run)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish bloqr-validator-core-cli to crates.io
        id: publish
        if: steps.check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bloqr-validator-core-cli --locked

      - name: Report publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::crates.io publish failed. Check CARGO_REGISTRY_TOKEN is configured as an org-level action secret with publish-new/publish-update/yank scopes for bloqr-validator-core-cli."
          exit 1
