name: Publish Rust Crates to crates.io

# Publishes four crates to crates.io whenever any of them change on main,
# or on demand: src/validation's bloqr-validator-core (library) and
# bloqr-validator-core-cli (the bloqr-validate binary, installable via
# `cargo install`), and src/compilers/rust's bloqr-compiler-core (library)
# and bloqr-compiler (the bloqr-compiler binary, also installable via
# `cargo install`). The compiler crate was split into a core lib + thin CLI
# crate mirroring the validator's core/cli split (#173) - the CLI package
# keeps the pre-split name `bloqr-compiler` so `cargo install bloqr-compiler`
# keeps working unchanged; the library was carved out under the new name
# `bloqr-compiler-core` (see src/compilers/rust/README.md's "Library usage"
# section for the resulting `cargo add bloqr-compiler-core` instructions).
# Mirrors publish-jsr.yml's pattern: path-filtered push trigger, independent
# of the repo-wide binary release in release.yml, so a change to any one of
# these doesn't have to wait for (or force) a full multi-language binary
# release to reach crates.io. See docs/architecture/versioning-strategy.md.
#
# bloqr-compiler was originally descoped from crates.io publishing (#365)
# as having no external library consumer; that decision was revisited and
# reversed - it now publishes alongside the validation crates using the
# same Trusted Publishing pattern. Its binary continues to also ship via
# release.yml's GitHub Release bundle; that's a separate, coordinated
# multi-language release event and doesn't gate or get gated by this
# crates.io publish.
#
# AUTHENTICATION: crates.io Trusted Publishing (OIDC) via
# rust-lang/crates-io-auth-action - no long-lived CARGO_REGISTRY_TOKEN
# secret needed. Requires a Trusted Publisher entry configured on
# crates.io for each of bloqr-validator-core, bloqr-validator-core-cli,
# bloqr-compiler-core, and bloqr-compiler (crate settings page -> Trusted
# Publishing -> GitHub -> owner BloqrAI, repo bloqr-core, workflow filename
# publish-crates.yml). The workflow needs `permissions: id-token: write`
# for the OIDC token exchange.
#
# HISTORY: this was tried once before and reverted - this org's GitHub
# Enterprise account had the "Use enterprise-specific issuer URL" OIDC
# setting enabled (issuer https://token.actions.githubusercontent.com/
# bloqrsystems instead of the plain https://token.actions.githubusercontent.com),
# which crates.io's trusted-publishing backend rejected outright
# ("Unsupported JWT issuer"). That setting has since been disabled
# enterprise-wide, so OIDC is back in use. If it starts failing with the
# same "Unsupported JWT issuer" error again, check whether that Enterprise
# setting got re-enabled before assuming this workflow is broken.
#

# VERSIONING: each crate's own Cargo.toml `version` field is the source of
# truth, bumped by hand today (no automated Conventional-Commits bump
# workflow yet - see docs/architecture/versioning-strategy.md's "what's
# still manual" note). This workflow doesn't bump anything, it just
# publishes whatever version is currently checked in, when it isn't already
# published - `cargo publish` has no native --skip-duplicate, so the
# idempotency check below does that job instead.
#
# bloqr-validator-core-cli depends on bloqr-validator-core via the registry
# (see its Cargo.toml's `version` alongside `path`), so publish-cli always
# runs after publish-core. Same pattern for the compiler crates: bloqr-compiler
# (CLI) depends on bloqr-compiler-core (library) via the registry, so
# publish-compiler-cli always runs after publish-compiler-core, which itself
# runs after publish-core (bloqr-compiler-core depends on bloqr-validator-core).

on:
  push:
    branches: ["main"]
    paths:
      - "src/validation/core/**"
      - "src/validation/cli/**"
      - "src/compilers/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish-crates.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-core:
    name: Publish bloqr-validator-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Dry-run publish (validates the package before the real push)
        run: cargo publish -p bloqr-validator-core --dry-run --locked

      - name: Check if this version is already published
        id: check
        run: |
          pkgid=$(cargo pkgid -p bloqr-validator-core)
          version="${pkgid##*@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "bloqr-core-ci (https://github.com/BloqrAI/bloqr-core)" "https://crates.io/api/v1/crates/bloqr-validator-core/${version}")
          if [ "$status" = "200" ]; then
            echo "Version ${version} is already published - skipping (idempotent re-run)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Exchanges this workflow run's OIDC identity for a short-lived
      # crates.io token (auto-revoked when the job ends) - requires the
      # Trusted Publisher entry on bloqr-validator-core's crates.io settings
      # page to reference this exact repo + workflow filename.
      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.already_published == 'false'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish bloqr-validator-core to crates.io
        id: publish
        if: steps.check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p bloqr-validator-core --locked

      - name: Report publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::crates.io publish failed. Check bloqr-validator-core's Trusted Publisher entry on crates.io points at BloqrAI/bloqr-core, workflow publish-crates.yml, and that the enterprise custom-OIDC-issuer setting is still disabled."
          exit 1

  publish-cli:
    name: Publish bloqr-validator-core-cli
    needs: publish-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      # A brand-new bloqr-validator-core version published moments ago by the
      # publish-core job above may not be visible on the registry index yet
      # (crates.io propagation isn't instant) - retry the dry-run a few times
      # rather than failing immediately if bloqr-validator-core-cli's version
      # requirement can't yet be resolved against it.
      - name: Dry-run publish (validates the package before the real push)
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo publish -p bloqr-validator-core-cli --dry-run --locked; then
              exit 0
            fi
            echo "Dry-run failed (attempt ${attempt}/5) - registry index may not have propagated bloqr-validator-core's latest version yet. Retrying in 15s..."
            sleep 15
            cargo update -p bloqr-validator-core-cli --precise "$(cargo pkgid -p bloqr-validator-core | sed 's/.*@//')" 2>/dev/null || true
          done
          echo "::error::cargo publish --dry-run kept failing for bloqr-validator-core-cli after 5 attempts."
          exit 1

      - name: Check if this version is already published
        id: check
        run: |
          pkgid=$(cargo pkgid -p bloqr-validator-core-cli)
          version="${pkgid##*@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "bloqr-core-ci (https://github.com/BloqrAI/bloqr-core)" "https://crates.io/api/v1/crates/bloqr-validator-core-cli/${version}")
          if [ "$status" = "200" ]; then
            echo "Version ${version} is already published - skipping (idempotent re-run)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Exchanges this workflow run's OIDC identity for a short-lived
      # crates.io token (auto-revoked when the job ends) - requires the
      # Trusted Publisher entry on bloqr-validator-core-cli's crates.io
      # settings page to reference this exact repo + workflow filename.
      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.already_published == 'false'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish bloqr-validator-core-cli to crates.io
        id: publish
        if: steps.check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p bloqr-validator-core-cli --locked

      - name: Report publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::crates.io publish failed. Check bloqr-validator-core-cli's Trusted Publisher entry on crates.io points at BloqrAI/bloqr-core, workflow publish-crates.yml, and that the enterprise custom-OIDC-issuer setting is still disabled."
          exit 1

  publish-compiler-core:
    name: Publish bloqr-compiler-core
    # Depends on bloqr-validator-core (not bloqr-validator-core-cli) since
    # that's the crate bloqr-compiler-core's Cargo.toml actually depends on -
    # see src/compilers/rust/core/Cargo.toml's `bloqr_validator` dependency.
    needs: publish-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      # A brand-new bloqr-validator-core version published moments ago by the
      # publish-core job above may not be visible on the registry index yet
      # (crates.io propagation isn't instant) - retry the dry-run a few times
      # rather than failing immediately if bloqr-compiler-core's version
      # requirement can't yet be resolved against it.
      - name: Dry-run publish (validates the package before the real push)
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo publish -p bloqr-compiler-core --dry-run --locked; then
              exit 0
            fi
            echo "Dry-run failed (attempt ${attempt}/5) - registry index may not have propagated bloqr-validator-core's latest version yet. Retrying in 15s..."
            sleep 15
            cargo update -p bloqr-validator-core --precise "$(cargo pkgid -p bloqr-validator-core | sed 's/.*@//')" 2>/dev/null || true
          done
          echo "::error::cargo publish --dry-run kept failing for bloqr-compiler-core after 5 attempts."
          exit 1

      - name: Check if this version is already published
        id: check
        run: |
          pkgid=$(cargo pkgid -p bloqr-compiler-core)
          version="${pkgid##*@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "bloqr-core-ci (https://github.com/BloqrAI/bloqr-core)" "https://crates.io/api/v1/crates/bloqr-compiler-core/${version}")
          if [ "$status" = "200" ]; then
            echo "Version ${version} is already published - skipping (idempotent re-run)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Exchanges this workflow run's OIDC identity for a short-lived
      # crates.io token (auto-revoked when the job ends) - requires the
      # Trusted Publisher entry on bloqr-compiler-core's crates.io settings
      # page to reference this exact repo + workflow filename.
      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.already_published == 'false'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish bloqr-compiler-core to crates.io
        id: publish
        if: steps.check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p bloqr-compiler-core --locked

      - name: Report publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::crates.io publish failed. Check bloqr-compiler-core's Trusted Publisher entry on crates.io points at BloqrAI/bloqr-core, workflow publish-crates.yml, and that the enterprise custom-OIDC-issuer setting is still disabled."
          exit 1

  publish-compiler-cli:
    name: Publish bloqr-compiler
    # Depends on bloqr-compiler-core (the library it wraps), not directly on
    # bloqr-validator-core - see src/compilers/rust/cli/Cargo.toml's
    # `bloqr_compiler` dependency.
    needs: publish-compiler-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      # A brand-new bloqr-compiler-core version published moments ago by the
      # publish-compiler-core job above may not be visible on the registry
      # index yet (crates.io propagation isn't instant) - retry the dry-run a
      # few times rather than failing immediately if bloqr-compiler's version
      # requirement can't yet be resolved against it.
      - name: Dry-run publish (validates the package before the real push)
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo publish -p bloqr-compiler --dry-run --locked; then
              exit 0
            fi
            echo "Dry-run failed (attempt ${attempt}/5) - registry index may not have propagated bloqr-compiler-core's latest version yet. Retrying in 15s..."
            sleep 15
            cargo update -p bloqr-compiler --precise "$(cargo pkgid -p bloqr-compiler-core | sed 's/.*@//')" 2>/dev/null || true
          done
          echo "::error::cargo publish --dry-run kept failing for bloqr-compiler after 5 attempts."
          exit 1

      - name: Check if this version is already published
        id: check
        run: |
          pkgid=$(cargo pkgid -p bloqr-compiler)
          version="${pkgid##*@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "bloqr-core-ci (https://github.com/BloqrAI/bloqr-core)" "https://crates.io/api/v1/crates/bloqr-compiler/${version}")
          if [ "$status" = "200" ]; then
            echo "Version ${version} is already published - skipping (idempotent re-run)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Exchanges this workflow run's OIDC identity for a short-lived
      # crates.io token (auto-revoked when the job ends) - requires the
      # Trusted Publisher entry on bloqr-compiler's crates.io settings
      # page to reference this exact repo + workflow filename.
      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.already_published == 'false'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish bloqr-compiler to crates.io
        id: publish
        if: steps.check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p bloqr-compiler --locked

      - name: Report publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::crates.io publish failed. Check bloqr-compiler's Trusted Publisher entry on crates.io points at BloqrAI/bloqr-core, workflow publish-crates.yml, and that the enterprise custom-OIDC-issuer setting is still disabled."
          exit 1
