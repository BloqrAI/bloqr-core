# Validation Library Compliance workflow
# Optimized with path-based triggers and simplified job structure

name: Validation Library Compliance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/validation/**'
      - 'src/compilers/**'
      - 'src/common/dotnet/**'
      - 'tools/check-validation-compliance.sh'
      - '.github/workflows/validation-compliance.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/validation/**'
      - 'src/compilers/**'
      - 'src/common/dotnet/**'
      - 'tools/check-validation-compliance.sh'
      - '.github/workflows/validation-compliance.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validation-library-build:
    name: Build Validation Library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-validation-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-validation-

      - name: Build validation library
        run: cargo build --release -p bloqr-validator-core

      - name: Run validation library tests
        run: cargo test -p bloqr-validator-core -p bloqr-validator-core-cli

      - name: Check clippy
        run: |
          cargo clippy -p bloqr-validator-core -p bloqr-validator-core-cli \
            --all-targets --all-features -- -W clippy::all -W clippy::correctness -W clippy::suspicious

      - name: Build CLI tool
        run: cargo build --release -p bloqr-validator-core-cli

      - name: Upload validation library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: validation-library
          path: |
            target/release/libbloqr_validator.*
            target/release/bloqr-validate
          retention-days: 7

  # Runs tools/check-validation-compliance.sh for real, gating the job on its
  # exit code - the previous version of this job duplicated a much weaker set
  # of inline grep checks (checked deno.json instead of TypeScript source,
  # checked a requirements.txt that doesn't exist so Python was permanently
  # "pending", never checked PowerShell at all) that could never fail the
  # build regardless of outcome. That script is the source of truth now.
  integration-status:
    name: Integration Status
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-validation-compliance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-validation-compliance-

      - name: Run validation compliance check
        run: |
          set -euo pipefail
          {
            echo "# Validation Library Compliance"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # pipefail (set above) ensures the step fails on the script's exit
          # code, not tee's - a bare `| tee` would otherwise mask a non-zero
          # exit from check-validation-compliance.sh.
          ./tools/check-validation-compliance.sh | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
