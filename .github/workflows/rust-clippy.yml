# Rust Build, Test and Security Analysis workflow
# Optimized with better caching, path-based triggers, and consolidated jobs

name: Rust CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - 'src/compilers/rust/**'
      - 'src/validation/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-clippy.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/compilers/rust/**'
      - 'src/validation/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-clippy.yml'
  schedule:
    - cron: '24 0 * * 6'  # Weekly security scan on Saturday
  # Lets fuzz-smoke-test (on-demand only, see that job's `if:`) be run by hand
  # without waiting for Saturday - see that job's comment for why it isn't
  # on push/pull_request any more.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cargo fmt -p bloqr-compiler -p bloqr-compiler-core -p bloqr-validator-core -p bloqr-validator-core-cli -- --check

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run clippy
        run: |
          cargo clippy --no-deps -p bloqr-compiler -p bloqr-compiler-core -p bloqr-validator-core -p bloqr-validator-core-cli \
            --all-features -- -D clippy::all -D clippy::correctness -D clippy::suspicious

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny (advisories, bans, licenses, sources)
        run: cargo deny check

  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-security-

      - name: Install SARIF tools
        run: cargo install clippy-sarif sarif-fmt

      - name: Run clippy for security analysis
        run: |
          cargo clippy --no-deps -p bloqr-compiler -p bloqr-compiler-core -p bloqr-validator-core -p bloqr-validator-core-cli \
            --all-features --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

  # On-demand only (workflow_dispatch), not on every push/pull_request or the
  # weekly schedule - fuzzing was adding meaningful time and CI-minutes cost
  # to every PR for a smoke-test-level signal. Trigger by hand from the
  # Actions tab (Rust CI -> Run workflow) when you want the fuzz targets
  # exercised, e.g. before a release or after touching untrusted-input
  # parsing code. Always fuzzes every target (no change-detection needed
  # any more, since this never runs unattended).
  fuzz-smoke-test:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/validation/core/fuzz/target
            src/compilers/rust/core/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('src/validation/core/fuzz/Cargo.lock', 'src/compilers/rust/core/fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      # Short, bounded runs (not continuous fuzzing) - enough to catch build
      # breaks and any trivially-reachable panic/crash, without turning a
      # manual run into a full fuzzing campaign. Corpus/crash artifacts
      # aren't persisted between runs; a real fuzzing campaign against an
      # accumulated corpus is a separate, opt-in exercise. 20s/target (not
      # 60s) for the same reason - this is a smoke test, not a campaign.
      - name: Fuzz fuzz_syntax_content (20s)
        working-directory: src/validation/core
        run: cargo +nightly fuzz run fuzz_syntax_content -- -max_total_time=20

      - name: Fuzz fuzz_config_json (20s)
        working-directory: src/validation/core
        run: cargo +nightly fuzz run fuzz_config_json -- -max_total_time=20

      - name: Fuzz fuzz_hash_database_json (20s)
        working-directory: src/validation/core
        run: cargo +nightly fuzz run fuzz_hash_database_json -- -max_total_time=20

      # fuzz/ lives inside core/ here (src/compilers/rust/core/fuzz), mirroring
      # src/validation/core/fuzz above - cargo-fuzz resolves the fuzz crate
      # relative to the nearest ancestor Cargo.toml from the working
      # directory, so it must be run from core/ (a real package), not from
      # src/compilers/rust/ itself, which has no Cargo.toml of its own since
      # the core/cli split (#173).
      - name: Fuzz fuzz_compiler_config (20s)
        working-directory: src/compilers/rust/core
        run: cargo +nightly fuzz run fuzz_compiler_config -- -max_total_time=20

      - name: Fuzz fuzz_merge_chunks (20s)
        working-directory: src/compilers/rust/core
        run: cargo +nightly fuzz run fuzz_merge_chunks -- -max_total_time=20

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: |
            src/validation/core/fuzz/artifacts/
            src/compilers/rust/core/fuzz/artifacts/
          if-no-files-found: ignore
