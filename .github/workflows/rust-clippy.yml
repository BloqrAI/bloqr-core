# Rust Build, Test and Security Analysis workflow
# Optimized with better caching, path-based triggers, and consolidated jobs

name: Rust CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - 'src/compilers/rust/**'
      - 'src/validation/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-clippy.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/compilers/rust/**'
      - 'src/validation/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-clippy.yml'
  schedule:
    - cron: '24 0 * * 6'  # Weekly security scan on Saturday

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cargo fmt -p bloqr-compiler -p bloqr-validator-core -p bloqr-validator-core-cli -- --check

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run clippy
        run: |
          cargo clippy --no-deps -p bloqr-compiler -p bloqr-validator-core -p bloqr-validator-core-cli \
            --all-features -- -D clippy::all -D clippy::correctness -D clippy::suspicious

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny (advisories, bans, licenses, sources)
        run: cargo deny check

  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-security-

      - name: Install SARIF tools
        run: cargo install clippy-sarif sarif-fmt

      - name: Run clippy for security analysis
        run: |
          cargo clippy --no-deps -p bloqr-compiler -p bloqr-validator-core -p bloqr-validator-core-cli \
            --all-features --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

  fuzz-smoke-test:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only fuzz a crate whose own files (or a workspace-level manifest, or
      # this workflow file itself - a workflow change should self-validate
      # against both) actually changed - most PRs touch one of the two
      # fuzzed crates, not both, and there's no value in re-fuzzing the
      # untouched one on every push. Always treated as "everything changed"
      # on the weekly scheduled run below (no base ref to diff against, and
      # that run is the one place a full sweep is actually wanted).
      - name: Detect changed crates
        if: github.event_name != 'schedule'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            validator:
              - 'src/validation/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust-clippy.yml'
            compiler:
              - 'src/compilers/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust-clippy.yml'

      - name: Install nightly Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/validation/core/fuzz/target
            src/compilers/rust/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('src/validation/core/fuzz/Cargo.lock', 'src/compilers/rust/fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      # Short, bounded runs (not continuous fuzzing) - enough to catch build
      # breaks and any trivially-reachable panic/crash on every PR, without
      # turning ordinary CI into a fuzzing farm. Corpus/crash artifacts
      # aren't persisted between runs; a real fuzzing campaign against an
      # accumulated corpus is a separate, opt-in exercise. 20s/target (not
      # 60s) for the same reason - this is a smoke test, not a campaign.
      - name: Fuzz fuzz_syntax_content (20s)
        if: github.event_name == 'schedule' || steps.filter.outputs.validator == 'true'
        working-directory: src/validation/core
        run: cargo +nightly fuzz run fuzz_syntax_content -- -max_total_time=20

      - name: Fuzz fuzz_config_json (20s)
        if: github.event_name == 'schedule' || steps.filter.outputs.validator == 'true'
        working-directory: src/validation/core
        run: cargo +nightly fuzz run fuzz_config_json -- -max_total_time=20

      - name: Fuzz fuzz_hash_database_json (20s)
        if: github.event_name == 'schedule' || steps.filter.outputs.validator == 'true'
        working-directory: src/validation/core
        run: cargo +nightly fuzz run fuzz_hash_database_json -- -max_total_time=20

      - name: Fuzz fuzz_compiler_config (20s)
        if: github.event_name == 'schedule' || steps.filter.outputs.compiler == 'true'
        working-directory: src/compilers/rust
        run: cargo +nightly fuzz run fuzz_compiler_config -- -max_total_time=20

      - name: Fuzz fuzz_merge_chunks (20s)
        if: github.event_name == 'schedule' || steps.filter.outputs.compiler == 'true'
        working-directory: src/compilers/rust
        run: cargo +nightly fuzz run fuzz_merge_chunks -- -max_total_time=20

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: |
            src/validation/core/fuzz/artifacts/
            src/compilers/rust/fuzz/artifacts/
          if-no-files-found: ignore
