# Consolidated security scanning workflow
# Combines CodeQL, DevSkim, and PSScriptAnalyzer

name: Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "28 16 * * 6"  # Weekly on Saturday

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Matches the languages this repo actually has source in: C# (.NET
        # compiler), JavaScript/TypeScript (Deno compiler + Gatsby site),
        # and Python (Python compiler). Keep in sync with what GitHub's own
        # "Default setup" auto-detects for this repo (python, csharp,
        # javascript-typescript) so switching between default/advanced setup
        # is never a silent coverage change.
        language: ["csharp", "javascript-typescript", "python"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # JS/TS and Python are analyzed without a build step (CodeQL's
          # extractors for both run directly against source). C# still
          # needs a real build, so it keeps the default build-mode and is
          # built explicitly below rather than via autobuild: the repo's
          # root build.sh drives every language's build and would fail here
          # since Deno/Python/etc. aren't set up in this job.
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}

      - name: Build .NET projects
        if: matrix.language == 'csharp'
        run: |
          dotnet restore src/compilers/dotnet/CompilerDotnet.slnx
          dotnet build src/compilers/dotnet/CompilerDotnet.slnx --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  devskim:
    name: DevSkim Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1

      - name: Upload DevSkim results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devskim-results.sarif

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f
        with:
          path: ./
          recurse: true
          includeRule: '"PSAvoidGlobalAliases", "PSAvoidUsingConvertToSecureStringWithPlainText"'
          output: results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
