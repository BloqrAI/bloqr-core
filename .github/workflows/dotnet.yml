# .NET Build and Test workflow
# Optimized with matrix strategy and path-based triggers

name: .NET

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - 'src/common/dotnet/**'
      - 'src/compilers/dotnet/**'
      - 'src/bloqr-dashboard/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/common/dotnet/**'
      - 'src/compilers/dotnet/**'
      - 'src/bloqr-dashboard/**'
      - '.github/workflows/dotnet.yml'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build Compiler Common
            path: src/common/dotnet
            solution: CompilerCommon.slnx
            filter: ""
          - name: Build Compiler Dotnet
            path: src/compilers/dotnet
            solution: CompilerDotnet.slnx
            filter: ""
          - name: Build Dashboard
            path: src/bloqr-dashboard
            solution: BloqrDashboard.slnx
            filter: ""

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore -c Release

      - name: Test
        run: |
          if [ -n "${{ matrix.filter }}" ]; then
            dotnet test ${{ matrix.solution }} --no-build -c Release --verbosity normal --filter "${{ matrix.filter }}"
          else
            dotnet test ${{ matrix.solution }} --no-build -c Release --verbosity normal
          fi
