# PowerShell Modules Build and Test workflow
# Covers the modular PowerShell toolkit (src/rules-compiler-powershell)

name: PowerShell Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - 'src/rules-compiler-powershell/**'
      - '.github/workflows/powershell.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/rules-compiler-powershell/**'
      - '.github/workflows/powershell.yml'

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $results = @()
          $results += Invoke-ScriptAnalyzer -Path 'src/rules-compiler-powershell' -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors.Count -gt 0) {
            Write-Host "::error::PSScriptAnalyzer found $($errors.Count) error(s)"
            exit 1
          }

  test-powershell-toolkit:
    name: Pester - PowerShell Toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0
          Import-Module Pester -PassThru
          $config = New-PesterConfiguration
          $config.Run.Path = 'src/rules-compiler-powershell'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
