name: Publish @bloqr/compiler-core to JSR

# Publishes src/compilers/typescript/ (the @bloqr/compiler-core package)
# to JSR whenever its version changes on main. `deno publish` is idempotent —
# it no-ops if the current deno.json version is already published — so this
# is safe to run on every push that touches the package.
#
# AUTHENTICATION: JSR OIDC ("trusted publishing") - deno publish auto-detects
# it's running in GitHub Actions with `id-token: write` permission and
# authenticates via GitHub's OIDC token, no secret needed. Requires
# @bloqr/compiler-core to be linked to this GitHub repository in JSR's
# package settings (already done - see issue #291).
#
# HISTORY: this previously failed with "InvalidIssuer" (see #291,
# jsr-io/jsr#1485) and this workflow fell back to the JSR_WORKFLOW_TOKEN
# secret (docs/jsr-token-authentication.md). Root cause was later found to
# be this org's GitHub Enterprise "Use enterprise-specific issuer URL" OIDC
# setting (same failure mode independently confirmed via crates.io's more
# descriptive rejection message) - not a JSR-side bug. That Enterprise
# setting has since been disabled, so OIDC is back in use. If this starts
# failing with InvalidIssuer again, check whether that setting got
# re-enabled before assuming JSR or this workflow is broken; the token
# fallback is still documented in docs/jsr-token-authentication.md.
#
# VERSIONING: deno.json's version is bumped automatically by
# compiler-core-version-bump.yml (Conventional Commits) and tagged by
# compiler-core-create-version-tag.yml on merge — this workflow doesn't bump
# anything itself, it just publishes whatever version is currently checked
# in. See docs/architecture/versioning-strategy.md for the full pattern.

on:
  push:
    branches: ["main"]
    paths:
      - "src/compilers/typescript/**"
      - ".github/workflows/publish-jsr.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: src/compilers/typescript

    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-jsr-publish-${{ hashFiles('src/compilers/typescript/deno.json') }}

      - name: Type check
        run: deno task check

      - name: Run tests
        run: deno task test

      - name: Lint
        run: deno task lint

      - name: Symbol documentation coverage
        run: deno task lint:docs

      - name: Dry-run publish (validates package, catches slow types)
        run: deno publish --dry-run

      - name: Publish to JSR
        id: publish
        run: deno publish

      - name: Report publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::deno publish failed. Check @bloqr/compiler-core is linked to this GitHub repository in JSR's package settings, and that the enterprise custom-OIDC-issuer setting is still disabled. Token-based fallback is documented in docs/jsr-token-authentication.md."
          exit 1
