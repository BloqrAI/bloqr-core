name: Publish adblock-compiler-core to JSR

# Publishes src/adblock-compiler-core (the @bloqr/compiler-core package)
# to JSR whenever its version changes on main. `deno publish` is idempotent —
# it no-ops if the current deno.json version is already published — so this
# is safe to run on every push that touches the package.
#
# AUTHENTICATION: Uses JSR_WORKFLOW_TOKEN (org-level Action secret, scoped to
# @bloqr namespace). See docs/jsr-token-authentication.md for setup and usage.

on:
  push:
    branches: ["main"]
    paths:
      - "src/adblock-compiler-core/**"
      - ".github/workflows/publish-jsr.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: src/adblock-compiler-core

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-jsr-publish-${{ hashFiles('src/adblock-compiler-core/deno.json') }}

      - name: Type check
        run: deno task check

      - name: Run tests
        run: deno task test

      - name: Lint
        run: deno task lint

      - name: Dry-run publish (validates package, catches slow types)
        run: deno publish --dry-run

      - name: Publish to JSR
        id: publish
        env:
          JSR_TOKEN: ${{ secrets.JSR_WORKFLOW_TOKEN }}
        run: deno publish

      - name: Report publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::deno publish failed. Check JSR_WORKFLOW_TOKEN is configured as an org-level action secret with @bloqr scope access, and that @bloqr/compiler-core is linked to this GitHub repository."
          exit 1
