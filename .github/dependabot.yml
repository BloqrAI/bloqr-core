# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot
#
# Coverage note: Dependabot has no native `jsr:` ecosystem, so pure
# JSR-native imports in src/adblock-compiler-core/deno.json (jsr:@std/*,
# jsr:@bloqr/*, etc.) are NOT covered by anything below — Dependabot's npm
# ecosystem can pick up Deno's npm: shorthand specifiers from a deno.lock,
# but not jsr: ones. That gap is covered separately by the scheduled
# `deno-dependency-check.yml` workflow, which runs `deno outdated` and
# opens a PR the same way the manual npm/cargo/nuget/pip ecosystems below
# do. See docs/RESTRUCTURING_RETROSPECTIVE.md for why this split exists.

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: "chore(devcontainer)"
    labels:
      - dependencies

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # npm: root package.json (Claude Agent SDK) and Deno's npm: shorthand
  # imports in src/adblock-compiler-core/deno.json / deno.lock. Does NOT
  # cover jsr: imports in that same file -- see deno-dependency-check.yml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # npm: Gatsby documentation site, separate package.json/lockfile.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(website)"
    labels:
      - dependencies
      - website
    groups:
      gatsby-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # cargo: workspace root covers rules-compiler-rust and both
  # bloqr-validator crates (workspace members), no separate entries needed.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(rust)"
    labels:
      - dependencies
      - rust
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # nuget: central package management (Directory.Packages.props at repo
  # root) covers every nested .csproj under src/rules-compiler-dotnet/.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(dotnet)"
    labels:
      - dependencies
      - dotnet
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/src/rules-compiler-python"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(python)"
    labels:
      - dependencies
      - python
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    labels:
      - dependencies
      - docker
