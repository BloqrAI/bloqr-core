# =============================================================================
# Docker Compose for Bloqr Core development
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main development environment with all tools
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    volumes:
      - .:/workspace
      # Named volumes for dependency caching
      - deno_cache:/root/.deno
      - cargo_registry:/root/.cargo/registry
      - cargo_git:/root/.cargo/git
      - nuget_packages:/root/.nuget/packages
    environment:
      - DEBUG=${DEBUG:-}
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
    working_dir: /workspace
    stdin_open: true
    tty: true
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # TypeScript Rules Compiler service
  # ---------------------------------------------------------------------------
  typescript-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    volumes:
      - .:/workspace
      - deno_cache:/root/.deno
    working_dir: /workspace/src/compilers/typescript
    command: deno task compile
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # .NET Compiler service
  # ---------------------------------------------------------------------------
  dotnet-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    volumes:
      - .:/workspace
      - nuget_packages:/root/.nuget/packages
    working_dir: /workspace/src/compilers/dotnet
    command: dotnet run --project src/Bloqr.Compiler.Dotnet.Console
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # Python Compiler service
  # ---------------------------------------------------------------------------
  python-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    volumes:
      - .:/workspace
    working_dir: /workspace/src/compilers/python
    command:
      - bash
      - -lc
      - python3 -m pip install --break-system-packages -e . && python3 -m bloqr_compiler
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # Rust Rules Compiler service
  # ---------------------------------------------------------------------------
  rust-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    volumes:
      - .:/workspace
      - cargo_registry:/root/.cargo/registry
      - cargo_git:/root/.cargo/git
    # bloqr-compiler (the CLI crate, #173's core/cli split) lives at
    # src/compilers/rust/cli; the library it wraps is src/compilers/rust/core.
    working_dir: /workspace/src/compilers/rust/cli
    command: cargo run --release
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # PowerShell Compiler service
  # ---------------------------------------------------------------------------
  powershell-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    command:
      - pwsh
      - -NoLogo
      - -NoProfile
      - -Command
      - "Import-Module '/workspace/src/compilers/powershell/BloqrCompiler/BloqrCompiler.psd1'; Invoke-BloqrCompiler"
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # Test runner service (runs the Linux-supported test suites)
  # ---------------------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    volumes:
      - .:/workspace
      - deno_cache:/root/.deno
      - nuget_packages:/root/.nuget/packages
      - cargo_registry:/root/.cargo/registry
      - cargo_git:/root/.cargo/git
    working_dir: /workspace
    command: >
      bash -c "
        echo '=== Running TypeScript Tests ===' &&
        cd /workspace/src/compilers/typescript && deno task test &&
        echo '=== Running Shared .NET Library Tests ===' &&
        cd /workspace/src/common/dotnet && dotnet test CompilerCommon.slnx &&
        echo '=== Running .NET Compiler Tests ===' &&
        cd /workspace/src/compilers/dotnet && dotnet test CompilerDotnet.slnx &&
        echo '=== Running Dashboard Tests ===' &&
        cd /workspace/src/apps/dashboard && dotnet test BloqrDashboard.slnx &&
        echo '=== Running Python Tests ===' &&
        cd /workspace/src/compilers/python &&
        python3 -m pip install --break-system-packages -e '.[dev]' &&
        pytest &&
        echo '=== Running Rust Workspace Tests ===' &&
        cd /workspace && cargo test --workspace &&
        echo '=== Running PowerShell Tests ===' &&
        pwsh -NoLogo -NoProfile -Command '$$result = Invoke-Pester -Path /workspace/src/compilers/powershell -Recurse -PassThru; if ($$result.FailedCount -gt 0) { exit 1 }' &&
        echo '=== All Linux-supported Tests Complete ==='
      "
    profiles:
      - test
    networks:
      - ad-blocking-net

  # AdGuard Console UI has moved to BloqrAI/bloqr-apiclients along with the
  # rest of the API clients; its docker-compose service now lives there.

  # ---------------------------------------------------------------------------
  # Swift Rules Compiler service - intentionally NOT defined here.
  # Dockerfile.warp is a Linux (Ubuntu/Noble) image and doesn't install a
  # Swift toolchain (see the comment at the top of that file for why), and
  # the Swift wrapper (src/compilers/swift/) is macOS-native (Xcode 16+,
  # Swift 6) anyway. Run `swift run bloqr-compiler` locally on macOS instead;
  # CI coverage is .github/workflows/swift.yml (macos-15).
  # ---------------------------------------------------------------------------

# =============================================================================
# Named volumes for dependency caching
# =============================================================================
volumes:
  deno_cache:
    name: ad-blocking-deno-cache
  cargo_registry:
    name: ad-blocking-cargo-registry
  cargo_git:
    name: ad-blocking-cargo-git
  nuget_packages:
    name: ad-blocking-nuget

# =============================================================================
# Networks
# =============================================================================
networks:
  ad-blocking-net:
    name: ad-blocking-network
    driver: bridge
