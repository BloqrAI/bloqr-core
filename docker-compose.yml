# =============================================================================
# Docker Compose for ad-blocking toolkit development
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main development environment with all tools
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile.warp
      args:
        DENO_VERSION: 2.x
        RUST_VERSION: stable
    image: ad-blocking-dev:latest
    container_name: ad-blocking-dev
    volumes:
      - .:/workspace
      # Named volumes for dependency caching
      - deno_cache:/root/.deno
      - cargo_registry:/root/.cargo/registry
      - cargo_git:/root/.cargo/git
      - nuget_packages:/root/.nuget/packages
    environment:
      - DEBUG=${DEBUG:-}
      - AdGuard__ApiKey=${ADGUARD_API_KEY:-}
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
    working_dir: /workspace
    stdin_open: true
    tty: true
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # TypeScript Rules Compiler service
  # ---------------------------------------------------------------------------
  typescript-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    container_name: ad-blocking-typescript
    volumes:
      - .:/workspace
      - deno_cache:/root/.deno
    working_dir: /workspace/src/compilers/typescript
    command: deno task compile
    depends_on:
      - dev
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # .NET Compiler service
  # ---------------------------------------------------------------------------
  dotnet-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    container_name: ad-blocking-dotnet
    volumes:
      - .:/workspace
      - nuget_packages:/root/.nuget/packages
    working_dir: /workspace/src/compilers/dotnet
    command: dotnet run --project src/Bloqr.Compiler.Dotnet.Console
    depends_on:
      - dev
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # Python Compiler service
  # ---------------------------------------------------------------------------
  python-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    container_name: ad-blocking-python
    volumes:
      - .:/workspace
    working_dir: /workspace/src/compilers/python
    command: python -m bloqr_compiler
    depends_on:
      - dev
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # Rust Rules Compiler service
  # ---------------------------------------------------------------------------
  rust-compiler:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    container_name: ad-blocking-rust
    volumes:
      - .:/workspace
      - cargo_registry:/root/.cargo/registry
      - cargo_git:/root/.cargo/git
    # bloqr-compiler (the CLI crate, #173's core/cli split) lives at
    # src/compilers/rust/cli; the library it wraps is src/compilers/rust/core.
    working_dir: /workspace/src/compilers/rust/cli
    command: cargo run --release
    depends_on:
      - dev
    profiles:
      - compile
    networks:
      - ad-blocking-net

  # ---------------------------------------------------------------------------
  # Test runner service (runs all tests)
  # ---------------------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: Dockerfile.warp
    image: ad-blocking-dev:latest
    container_name: ad-blocking-test
    volumes:
      - .:/workspace
      - deno_cache:/root/.deno
      - nuget_packages:/root/.nuget/packages
      - cargo_registry:/root/.cargo/registry
      - cargo_git:/root/.cargo/git
    working_dir: /workspace
    command: >
      bash -c "
        echo '=== Running TypeScript Tests ===' &&
        cd /workspace/src/compilers/typescript && deno task test &&
        echo '=== Running .NET Tests ===' &&
        cd /workspace/src/compilers/dotnet && dotnet test CompilerDotnet.slnx &&
        echo '=== Running Python Tests ===' &&
        cd /workspace/src/compilers/python && pytest &&
        echo '=== Running Rust Tests ===' &&
        cargo test -p bloqr-compiler -p bloqr-compiler-core &&
        echo '=== Running PowerShell Tests ===' &&
        pwsh -Command 'Invoke-Pester -Path /workspace/src/compilers/powershell -PassThru' &&
        echo '=== All Tests Complete ==='
      "
    depends_on:
      - dev
    profiles:
      - test
    networks:
      - ad-blocking-net

  # AdGuard Console UI has moved to BloqrAI/bloqr-apiclients along with the
  # rest of the API clients; its docker-compose service now lives there.

# =============================================================================
# Named volumes for dependency caching
# =============================================================================
volumes:
  deno_cache:
    name: ad-blocking-deno-cache
  cargo_registry:
    name: ad-blocking-cargo-registry
  cargo_git:
    name: ad-blocking-cargo-git
  nuget_packages:
    name: ad-blocking-nuget

# =============================================================================
# Networks
# =============================================================================
networks:
  ad-blocking-net:
    name: ad-blocking-network
    driver: bridge
