[package]
name = "bloqr-validator-core-cli"
# Independent version, not workspace-inherited: the CLI's own release cadence
# (flag/UX changes) is decoupled from the library's (validation-logic
# changes) even though it's not yet independently published - see
# docs/architecture/versioning-strategy.md.
version = "1.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI tool for AdGuard filter validation"

[[bin]]
name = "rules-validate"
path = "src/main.rs"

[dependencies]
rules_validator = { path = "../rules-validator-core", package = "bloqr-validator-core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
