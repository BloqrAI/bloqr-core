[package]
name = "bloqr-compiler"
# Independent version, not workspace-inherited: bloqr-compiler is now its
# own published crates.io artifact and must be bumpable on its own cadence,
# decoupled from bloqr-validator-core/-cli and from the workspace's
# internal version - see docs/architecture/versioning-strategy.md. Starts
# at 1.0.0 for continuity with the version it already shipped under via
# release.yml's GitHub Release binaries.
version = "1.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Bloqr's Rust API and CLI for compiling AdGuard filter rules using hostlist-compiler. Part of the bloqr-core toolkit (github.com/BloqrAI/bloqr-core)."
readme = "README.md"
keywords = ["bloqr", "adguard", "filter", "adblock", "compiler"]
categories = ["command-line-utilities", "web-programming"]
rust-version.workspace = true

[lib]
name = "bloqr_compiler"
path = "src/lib.rs"

[[bin]]
name = "bloqr-compiler"
path = "src/main.rs"

[dependencies]
# Rules validation (workspace sibling - no registry involved)
bloqr_validator = { path = "../../validation/core", package = "bloqr-validator-core", version = "1" }

# Async runtime
tokio = { workspace = true, features = ["fs", "process", "io-util"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }

# CLI
clap = { workspace = true }
dialoguer = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Hashing
sha2 = { workspace = true }
hex = { workspace = true }

# Cross-platform
which = { workspace = true }

# Async utilities
futures = { workspace = true }

# Logging/tracing
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# UUID for temp files
uuid = { workspace = true }

# Random number generation (for benchmarks)
rand = "0.10"

# Rust version at runtime
rustc_version_runtime = { workspace = true }

# Platform-specific file locking (Unix only - Windows uses open file handles)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
