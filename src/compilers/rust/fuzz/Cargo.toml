[package]
name = "bloqr-compiler-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# This crate is intentionally NOT a member of the parent workspace
# (Cargo won't build it as part of `cargo build --workspace`, and it needs
# its own nightly-only, sanitizer-instrumented build). This empty table
# marks it as its own workspace root so Cargo doesn't try to fold it into
# the repo-root workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"

[dependencies.bloqr_compiler]
# Fuzzes the library's config-parsing and chunk-merging logic, not the CLI -
# points at the bloqr-compiler-core lib crate (see ../core), not the
# bloqr-compiler CLI crate (../cli) this used to live alongside as one crate.
package = "bloqr-compiler-core"
path = "../core"

[[bin]]
name = "fuzz_compiler_config"
path = "fuzz_targets/fuzz_compiler_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_merge_chunks"
path = "fuzz_targets/fuzz_merge_chunks.rs"
test = false
doc = false
bench = false
