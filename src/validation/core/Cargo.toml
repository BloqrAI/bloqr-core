[package]
name = "bloqr-validator-core"
# Independent version, not workspace-inherited: bloqr-validator-core is its
# own published crates.io artifact (#365) and must be bumpable on its own
# cadence, decoupled from bloqr-validator-core-cli and bloqr-compiler - see
# docs/architecture/versioning-strategy.md.
version = "1.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bloqr's core validation library for adblock/hosts filter list compilation: hash verification, URL security, and syntax validation. Part of the bloqr-core toolkit (github.com/BloqrAI/bloqr-core)."
readme = "README.md"
keywords = ["bloqr", "adblock", "validation", "security", "filter"]
categories = ["web-programming", "cryptography", "parser-implementations"]

[lib]
name = "bloqr_validator"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]  # Support both native and FFI

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
url = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
walkdir = { workspace = true }
# Compiled-in Public Suffix List (no runtime fetch) - see
# docs/adr/0003-adguard-hostlist-compatibility.md Phase 2 for why this was
# chosen over `publicsuffix` (which needs either a runtime fetch or a
# self-maintained list file - neither fits this crate's offline-by-design posture).
psl = "2"
regex = { workspace = true }

# WASM support
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Request", "Response", "Headers"] }

[dev-dependencies]
tempfile = { workspace = true }
