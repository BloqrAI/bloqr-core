language = "C"
header = """
/*
 * bloqr_validator.h — C header for bloqr-validator-core's FFI surface.
 *
 * Generated by cbindgen from src/ffi.rs. Do not edit by hand — regenerate
 * with (run from src/validation/core/):
 *
 *   cargo install cbindgen
 *   cbindgen --config cbindgen.toml --crate bloqr-validator-core \\
 *     --output bloqr_validator.h
 *
 * See src/ffi.rs's module doc for usage conventions (opaque handle,
 * caller-owns-and-frees-strings, JSON-encoded results/errors).
 */
"""
include_guard = "BLOQR_VALIDATOR_H"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"

[export]
prefix = ""
include = ["Validator", "FfiStatus"]

[fn]
prefix = ""
args = "auto"

[enum]
rename_variants = "None"
prefix_with_name = false
